<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Analysis Report Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="card">
    <header>
      <div class="logo" aria-hidden="true">AI</div>
      <h1>Video Analysis Report</h1>
      <p class="subtitle">Upload a video. Gemini extracts the transcript, answers the key questions,
        and a PDF report is emailed to <strong>rk26.ftw@gmail.com</strong>.</p>
    </header>

    <form id="upload-form">
      <label id="dropzone" class="dropzone" for="file-input">
        <input id="file-input" name="file" type="file" accept="video/*,.mp4,.mov,.webm,.mkv,.avi" />
        <div class="dz-icon" aria-hidden="true">+</div>
        <div class="dz-text"><strong>Click to choose</strong> or drag &amp; drop a video</div>
        <div class="dz-hint">MP4, MOV, WEBM, MKV, AVI</div>
        <div id="file-info" class="file-info" hidden></div>
      </label>

      <button id="generate-btn" type="submit" class="btn" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">Generate Report</span>
      </button>
    </form>

    <div id="status" class="status" hidden>
      <span id="status-text">Uploading…</span>
      <span id="elapsed" class="elapsed">0s</span>
    </div>

    <div id="alert" class="alert" role="alert" hidden></div>
    <section id="results" class="results" hidden></section>

    <footer>Questions analysed: number of speakers · company name · average salary</footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
